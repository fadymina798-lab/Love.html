

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To My Love ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:radial-gradient(ellipse at top,#50152f 0%,#200c20 45%,#080710 100%);
  color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  text-align:center;
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
  radial-gradient(2px 2px at 20% 30%,#fff,transparent),
  radial-gradient(2px 2px at 70% 20%,#ffb6d5,transparent),
  radial-gradient(2px 2px at 40% 75%,#fff,transparent),
  radial-gradient(2px 2px at 85% 65%,#ff9bc5,transparent),
  radial-gradient(2px 2px at 10% 85%,#fff,transparent);
  background-size:180px 180px;
  animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.3}
  to{opacity:1}
}

.container{
  position:relative;
  z-index:2;
  width:90%;
  max-width:430px;
  margin:auto;
  padding:65px 0 40px;
}

.small-title{
  color:#ffabc9;
  font-size:13px;
  letter-spacing:3px;
  margin-bottom:15px;
}

h1{
  font-size:29px;
  color:#ffe3ed;
  text-shadow:0 0 20px #ff438c;
  margin-bottom:15px;
}

.subtitle{
  color:#e9b4cc;
  font-size:14px;
  line-height:2;
}

.envelope{
  margin:65px auto 25px;
  width:180px;
  height:125px;
  position:relative;
  background:#9d2855;
  border-radius:8px;
  box-shadow:0 0 40px #ff397d66;
  cursor:pointer;
  animation:float 3s infinite ease-in-out;
}

.envelope:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-top:75px solid #e75c91;
  transform-origin:top;
  transition:transform .8s;
  z-index:3;
}

.envelope:after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-bottom:65px solid #b93668;
  z-index:2;
}

.envelope.open:before{
  transform:rotateX(180deg);
}

.seal{
  position:absolute;
  top:43px;
  left:70px;
  z-index:4;
  font-size:38px;
  filter:drop-shadow(0 0 12px #ffb6d5);
  animation:beat 1s infinite;
}

@keyframes beat{
  50%{transform:scale(1.2)}
}

@keyframes float{
  50%{transform:translateY(-12px)}
}

.hint{
  color:#ffc3d9;
  font-size:14px;
  margin-bottom:45px;
}

button{
  border:1px solid #ff9bc5;
  background:linear-gradient(135deg,#b92760,#ef548c);
  color:white;
  padding:14px 32px;
  border-radius:40px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 25px #ff398c66;
}

button:active{transform:scale(.95)}

#letter{
  display:none;
  margin-top:35px;
  padding:27px 20px;
  border:1px solid #c65a86;
  border-radius:20px;
  background:linear-gradient(145deg,#351327dd,#180e20ee);
  box-shadow:0 0 35px #ff438c22;
  line-height:2.3;
  text-align:center;
}

#letter h2{
  color:#ff9bc5;
  font-size:25px;
  margin-bottom:20px;
}

#poem{
  color:#ffe5ef;
  font-size:16px;
  white-space:pre-line;
  min-height:100px;
}

.signature{
  margin-top:28px;
  color:#ffb0d0;
  font-size:19px;
  line-height:2;
}

.signature span{
  display:block;
  font-family:Georgia,serif;
  font-style:italic;
  letter-spacing:2px;
  font-size:17px;
}

.final-heart{
  font-size:35px;
  margin-top:15px;
  animation:beat 1s infinite;
}

.floating{
  position:fixed;
  bottom:-30px;
  z-index:1;
  pointer-events:none;
  animation:rise linear forwards;
}

@keyframes rise{
  to{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}

#heartCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
}

</style>
</head>

<body>

<div class="stars"></div>
<canvas id="heartCanvas"></canvas>

<div class="container">

  <div class="small-title">A LETTER FROM MY HEART</div>

  <h1>إلى أجمل أقداري ❤️</h1>

  <div class="subtitle">
    هناك كلام لا تستطيع العين قوله...<br>
    ولا يستطيع القلب أن يحتفظ به للأبد.
  </div>

  <div class="envelope" id="envelope" onclick="openLetter()">
    <div class="seal">❤️</div>
  </div>

  <div class="hint" id="hint">
    رسالة صغيرة... لكنها تحمل قلبًا كاملًا
  </div>

  <button id="openBtn" onclick="openLetter()">
    افتحي رسالتي ❤️
  </button>

  <div id="letter">

    <h2>يا نور عيني ❤️</h2>

    <div id="poem"></div>

    <div class="signature" id="signature" style="display:none">
      بحبك... أكتر مما تتخيلي ❤️
      <span>Forever Yours</span>
      <span>Fady Mina</span>
    </div>

    <div class="final-heart">💗</div>

  </div>

</div>

<script>

const message = `بحبك... ❤️

ولو كان للحب وطن،
فأنا وطني هو وجودك،
ولو كان للراحة عنوان،
فأنا عنواني هو حضنك.

عارفة؟
أنا مش دايمًا هكون هادي،
ومش كل يوم هيكون سهل،
ساعات هكون عصبي،
وساعات هتغلبني ضغوط الدنيا،
وهحس إن كل حاجة ضدي...

بس وسط كل ده،
نفسي ألاقي فيكي الأمان،
والحضن الحنين اللي أهرب له آخر اليوم،
وأحس إن الدنيا لسه فيها حاجة حلوة تستاهل.

أنا مش بوعدك إن حياتنا هتكون من غير مشاكل،
لكن بوعدك إني أحاول كل يوم أكون أحسن،
وأحافظ على قلبك،
وأكون سبب في ضحكتك مش دموعك.

نفسي أكون الشخص اللي لما تتعبي
تلاقيه جنبك،
ولما تفرحي يكون أول واحد يفرحلك،
ولما الدنيا تضيق بيكي
تلاقي قلبه مفتوح ليكي.

يا نور عيني،
أنا أوعدك إني ليكي،
وإني هسعى أسعدك،
وأخليكي أسعد إنسانة على وجه الأرض.

ولو سألتيني إيه أجمل حاجة حصلتلي؟
هقولك إن قلبي اختارك،
وإن وجودك بقى من الحاجات
اللي بدعي ربنا يديمها في حياتي.

بحبك... ومهما كتبت،
هتفضل جوايا مشاعر أكبر من كل الكلام. ❤️`;

let opened = false;

function openLetter(){
  if(opened) return;
  opened = true;

  document.getElementById("envelope").classList.add("open");
  document.getElementById("hint").style.display="none";
  document.getElementById("openBtn").style.display="none";

  setTimeout(()=>{
    document.getElementById("letter").style.display="block";
    document.getElementById("letter").scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
    typeText();
  },900);

  startHearts();
  createHeart();
}

function typeText(){
  let i=0;
  const poem=document.getElementById("poem");

  function write(){
    if(i<message.length){
      poem.textContent+=message.charAt(i);
      i++;
      setTimeout(write,48);
    }else{
      document.getElementById("signature").style.display="block";
    }
  }
  write();
}

// قلوب متحركة
function startHearts(){
  setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="floating";
    heart.textContent=["❤️","💕","💗","💖","🌹"]
      [Math.floor(Math.random()*5)];

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    heart.style.animationDuration=(5+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),10000);
  },450);
}

// تكوين قلب من الجزيئات
const canvas=document.getElementById("heartCanvas");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let particles=[];

function createHeart(){
  const cx=canvas.width/2;
  const cy=canvas.height*.45;
  const scale=Math.min(canvas.width,canvas.height)/38;

  for(let i=0;i<180;i++){
    let t=Math.random()*Math.PI*2;

    let x=16*Math.pow(Math.sin(t),3);
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)
    -2*Math.cos(3*t)-Math.cos(4*t));

    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      tx:cx+x*scale,
      ty:cy+y*scale,
      color:["#ff4b91","#ff9bc5","#ffffff"]
      [Math.floor(Math.random()*3)]
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=(p.tx-p.x)*.025;
    p.y+=(p.ty-p.y)*.025;

    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.shadowBlur=12;
    ctx.shadowColor=p.color;
    ctx.fill();
  });

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
